# Charter of a fictional company. Copy to fleet.yaml to use it. Format still in design.
company: Acme Solar

departments:
  support:
    profile: support
    owns:
      - Product usage questions
      - Customer ticket status
    does_not_own:
      - Bugs and infrastructure failures
    escalates_to: tech

  tech:
    profile: dev
    initial_status: ready
    owns:
      - Bugs, incidents and infrastructure failures
      - Pull requests and code review
    intake: |
      First investigate root cause and estimate complexity. Do not modify production code
      on the first pass. Open a GitHub issue with the diagnostic summary and Zendesk link.

  sales:
    profile: sales
    owns:
      - Proposals and commercial follow-up
    does_not_own:
      - Contracts and billing
    escalates_to: operations

  operations:
    profile: ops
    owns:
      - Contracts and billing
      - Priorities that cross departments
