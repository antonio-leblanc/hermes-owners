name: owners
version: 0.1.0
description: Makes a fleet of profiles work as the departments of a human company
provides_hooks:
  - pre_llm_call
provides_tools:
  - handoff_task
config_schema:
  fleet_path:
    type: str
    default: "~/.hermes/fleet.yaml"
    label: "Fleet charter"
    description: "Path to the fleet.yaml that maps departments to profiles"
